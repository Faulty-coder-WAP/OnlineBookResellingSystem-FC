spring.application.name=OBRS-BackEnd
server.port=${PORT:8000}

# active profile (dev/prod) should be set by env var: SPRING_PROFILES_ACTIVE
spring.profiles.default=dev

# secret-key
jwt.secret.key=${JWT_KEY}

# cloudinary details
c_cName=${cloudinary_cloudname}
c_aK=${cloudinary_apikey}
c_aSk=${cloudinary_apisk}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.swagger-ui.tagsSorter=alpha

#logging
logging.file.path=logs
logging.file.name=${logging.file.path}/obrs-backend.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
